[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=scraper_playwright
    --cov=scraper_requests
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html

[coverage:run]
source = .
omit = 
    tests/*
    .venv/*
    venv/*
    setup.py
    examples/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

