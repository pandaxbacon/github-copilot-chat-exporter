coverage:
  status:
    project:
      default:
        target: 70%
        threshold: 2%
    patch:
      default:
        target: 70%

ignore:
  - "tests/*"
  - "setup.py"
  - "examples/*"
  - ".venv/*"
  - "venv/*"
  - "**/__pycache__/*"

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: false


